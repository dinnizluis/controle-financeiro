[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "controle-financeiro"
version = "0.1.0"
description = "Personal budget MVP with cycle-based planning"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "streamlit>=1.37",
  "sqlalchemy>=2.0",
  "pydantic>=2.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.0",
  "pyright>=1.1",
  "pip-audit>=2.7",
  "ruff==0.16.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
exclude = [".specify"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["controle_financeiro"]

[tool.coverage.report]
show_missing = true

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
