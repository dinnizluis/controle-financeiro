[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "controle-financeiro"
version = "0.1.0"
description = "Personal budget project setup with AI-first workflow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.37",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
