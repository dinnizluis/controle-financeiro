name: quality

on:
  pull_request:
  push:
    branches:
      - development

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m venv .venv && .venv/bin/python -m pip install --upgrade pip && .venv/bin/python -m pip install -e '.[dev]'
      - name: Test
        run: .venv/bin/python -m pytest -q --cov=controle_financeiro --cov-report=term-missing
      - name: Check formatting
        run: .venv/bin/python -m ruff format --check .
      - name: Lint
        run: .venv/bin/python -m ruff check .
      - name: Check types
        run: .venv/bin/python -m pyright
      - name: Audit dependencies
        run: .venv/bin/python -m pip_audit